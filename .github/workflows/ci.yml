name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  test:
    name: Static check + self-checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static check
        run: python Scripts/check.py

      # No display and no fonts on a runner, so the screenshots are throwaway;
      # what CI gets out of this area is that the window builds and every slot
      # runs without throwing.
      - name: Self-check — ui
        env:
          QT_QPA_PLATFORM: offscreen
          IGP_SKIP_CAPTURE_GEN: "1"
        run: python -m src.main -t ui

      - name: Self-check — update
        run: python -m src.main -t update

      # The capture area is deliberately absent: PresentMon needs admin and a
      # GPU actually presenting frames, neither of which a runner has.

      - name: Contract checks
        env:
          QT_QPA_PLATFORM: offscreen
          IGP_SKIP_CAPTURE_GEN: "1"
        run: python -m src.tests
